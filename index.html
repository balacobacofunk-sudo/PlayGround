<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Dino Evolution</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8ac7ee;font-family:Trebuchet MS,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 2px 3px #000}
    #top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
    .panel{background:rgba(25,38,35,.72);border:2px solid rgba(255,255,255,.22);border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.18);backdrop-filter:blur(8px)}
    #stats{padding:9px 12px;min-width:205px}.name{display:flex;justify-content:space-between;gap:14px;font-weight:900;font-size:14px}.xpbar{height:11px;margin-top:7px;border-radius:8px;background:#18231f;border:1px solid #60766e;overflow:hidden}.xpbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5fe278,#b5f052);border-radius:8px;transition:.25s}
    #coins{padding:9px 13px;font-size:19px;font-weight:900;color:#ffe172}.coin{display:inline-block;width:18px;height:18px;margin-right:5px;border-radius:50%;background:#ffc928;border:3px solid #fff09a;box-shadow:0 2px #b77816;vertical-align:-2px}
    #levelName{position:absolute;left:50%;top:74px;transform:translateX(-50%);font-size:13px;font-weight:900;padding:6px 12px;border-radius:20px;text-align:center;white-space:nowrap}
    #controls{position:absolute;left:18px;bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(20,35,31,.18);border:2px solid rgba(255,255,255,.28);pointer-events:auto}#stick{position:absolute;width:66px;height:66px;left:42px;top:42px;border-radius:50%;background:rgba(245,255,248,.82);border:3px solid rgba(255,255,255,.95);box-shadow:0 5px 15px rgba(0,0,0,.25)}
    #bite{position:absolute;right:24px;bottom:max(38px,calc(env(safe-area-inset-bottom) + 18px));width:98px;height:98px;border-radius:50%;border:5px solid rgba(255,255,255,.85);background:linear-gradient(145deg,#ffb93f,#e84e32);color:white;font-size:20px;font-weight:1000;text-shadow:0 2px 2px #7a2800;pointer-events:auto;box-shadow:0 8px 20px rgba(90,35,20,.35)}#bite:active{transform:scale(.94)}
    #toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:12px;background:#1d332ddf;font-weight:900;text-align:center;transition:.25s;white-space:nowrap}#toast.show{opacity:1;transform:translateX(-50%)}
    #start{position:absolute;inset:0;background:linear-gradient(180deg,rgba(83,171,210,.2),rgba(41,91,62,.72));display:flex;align-items:center;justify-content:center;text-align:center;color:white;pointer-events:auto}#startCard{width:min(380px,calc(100% - 38px));padding:26px 22px;border:3px solid rgba(255,255,255,.4)}#start h1{margin:0;font-size:42px;line-height:.95;text-shadow:0 4px #315b3d}#start p{font-size:15px;margin:12px 0 18px}#play{border:0;border-radius:18px;padding:14px 34px;background:#ffcf3d;color:#4a3a14;font-size:20px;font-weight:1000;box-shadow:0 6px 0 #c58a21;pointer-events:auto}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="top"><div id="stats" class="panel"><div class="name"><span id="dinoName">Raptor Verde</span><span id="lv">LV 1</span></div><div class="xpbar"><i id="xp"></i></div></div><div id="coins" class="panel"><i class="coin"></i><span id="money">0</span></div></div>
    <div id="levelName" class="panel">1 • Raptor Jovem</div>
    <div id="controls"><div id="stick"></div></div>
    <button id="bite">MORDER</button>
    <div id="toast" class="panel">+25 XP</div>
  </div>
  <div id="start"><div id="startCard" class="panel"><h1>DINO<br>EVOLUÇÃO</h1><p>Caça humanos, ganhe XP e abra baús.<br>Cada presa vale uma recompensa diferente.</p><button id="play">JOGAR</button></div></div>
  <script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
  const canvas=document.querySelector('#game'), scene=new THREE.Scene();scene.background=new THREE.Color(0x83c8e7);scene.fog=new THREE.Fog(0x83c8e7,18,48);
  const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,10,14);
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  scene.add(new THREE.HemisphereLight(0xdff4ff,0x5b7945,2));const sun=new THREE.DirectionalLight(0xfffacd,2.5);sun.position.set(-10,20,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
  const ground=new THREE.Mesh(new THREE.CircleGeometry(24,48),new THREE.MeshStandardMaterial({color:0x72ad48,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  for(let i=0;i<20;i++){const x=(Math.random()-.5)*42,z=(Math.random()-.5)*42;if(Math.hypot(x,z)<8)continue;const t=new THREE.Mesh(new THREE.ConeGeometry(.55,.7,5),new THREE.MeshStandardMaterial({color:i%2?0x4f8737:0x638f3a}));t.position.set(x,.35,z);scene.add(t)}
  const levels=[{name:'Raptor Jovem',color:0x62c36b,scale:.75},{name:'Raptor Alpha',color:0x3ba94f,scale:.92},{name:'Carnotaurus',color:0x8eaa45,scale:1.12},{name:'T-Rex Verde',color:0x367d38,scale:1.38},{name:'T-Rex Supremo',color:0x244f2d,scale:1.65}];
  let level=1,xp=0,money=0,active=false,gameOver=false;
  function makeDino(){const g=new THREE.Group();const col=levels[level-1].color;const mat=new THREE.MeshStandardMaterial({color:col,roughness:.7});const dark=new THREE.MeshStandardMaterial({color:0x27592f});
    const body=new THREE.Mesh(new THREE.SphereGeometry(1.15,16,10),mat);body.scale.set(1.25,1,1.5);body.position.y=.95;body.castShadow=true;g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.72,16,10),mat);head.scale.set(1.15,.75,1.25);head.position.set(0,1.5,1.25);head.castShadow=true;g.add(head);
    const snout=new THREE.Mesh(new THREE.BoxGeometry(.85,.38,1),mat);snout.position.set(0,1.32,2.05);g.add(snout);const eyeGeo=new THREE.SphereGeometry(.09,8,8);for(const x of [-.42,.42]){const eye=new THREE.Mesh(eyeGeo,new THREE.MeshBasicMaterial({color:0xfff3ad}));eye.position.set(x,1.68,1.65);g.add(eye)}
    for(const x of [-.65,.65]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.65,4,8),mat);leg.position.set(x,.35,.25);leg.castShadow=true;g.add(leg);leg.userData.leg=true}
    for(let i=0;i<4;i++){const spike=new THREE.Mesh(new THREE.ConeGeometry(.16,.55,5),dark);spike.position.set(0,1.95-i*.07,-.65-i*.38);spike.rotation.x=-.7-i*.05;g.add(spike)}
    g.scale.setScalar(levels[level-1].scale);return g}let dino=makeDino();dino.position.set(0,0,0);scene.add(dino);
  function person(){const g=new THREE.Group();const shirts=[0x3d77b8,0xe05a54,0xf4c542,0x7652a8,0xf3f2ed];const id=Math.random();const xpVal=id>.82?50:id>.55?35:id>.25?25:15;
    const shirt=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.75,4,8),new THREE.MeshStandardMaterial({color:shirts[Math.floor(Math.random()*shirts.length)]}));shirt.position.y=.75;shirt.castShadow=true;g.add(shirt);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshStandardMaterial({color:0xc58b5b}));head.position.y=1.48;head.castShadow=true;g.add(head);for(const x of [-.16,.16]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.55,3,6),new THREE.MeshStandardMaterial({color:0x263b55}));leg.position.set(x,.25,0);g.add(leg)}g.userData={xp:xpVal,alive:true};g.position.set((Math.random()-.5)*34,.0,(Math.random()-.5)*34);if(g.position.length()<7)g.position.z+=8;scene.add(g);return g}
  let people=Array.from({length:12},person);
  function chest(){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.BoxGeometry(1.25,.65,1),new THREE.MeshStandardMaterial({color:0xa95b25,roughness:.5}));base.position.y=.35;base.castShadow=true;g.add(base);const lid=new THREE.Mesh(new THREE.BoxGeometry(1.28,.42,1),new THREE.MeshStandardMaterial({color:0xd58a32,roughness:.5}));lid.position.y=.85;lid.rotation.x=-.12;lid.castShadow=true;g.add(lid);for(let i=-1;i<=1;i+=2){const band=new THREE.Mesh(new THREE.BoxGeometry(.12,.65,1.05),new THREE.MeshStandardMaterial({color:0xffcf40,metalness:.3}));band.position.set(i*.42,.35,0);g.add(band)}g.position.set((Math.random()-.5)*26,.05,(Math.random()-.5)*26);if(g.position.length()<7)g.position.z+=10;g.userData.open=false;scene.add(g);return g}const chests=[chest(),chest(),chest()];
  const keys={};let stick={x:0,y:0},stickOn=false;
  addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
  const controls=document.querySelector('#controls'),stickEl=document.querySelector('#stick');function moveStick(e){const r=controls.getBoundingClientRect(),p=e.touches?e.touches[0]:e;let x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2);const l=Math.hypot(x,y),m=55;if(l>m){x=x/l*m;y=y/l*m}stick={x:x/m,y:y/m};stickEl.style.transform=`translate(${x}px,${y}px)`}controls.addEventListener('pointerdown',e=>{stickOn=true;controls.setPointerCapture(e.pointerId);moveStick(e)});controls.addEventListener('pointermove',e=>{if(stickOn)moveStick(e)});controls.addEventListener('pointerup',()=>{stickOn=false;stick={x:0,y:0};stickEl.style.transform=''});
  function bite(){if(!active)return;let found=null,min=2.05;for(const p of people){if(!p.userData.alive)continue;const d=dino.position.distanceTo(p.position);if(d<min){found=p;min=d}}if(found){found.userData.alive=false;found.visible=false;xp+=found.userData.xp;toast(`+${found.userData.xp} XP`);setTimeout(()=>{if(active){scene.remove(found);people[people.indexOf(found)]=person()}},700)}else{for(const c of chests){if(!c.userData.open&&dino.position.distanceTo(c.position)<2){openChest(c);break}}}}
  document.querySelector('#bite').addEventListener('pointerdown',e=>{e.prevent.preventDefault;bite()});
  function openChest(c){c.userData.open=true;c.children[1].rotation.x=-1.2;const reward=Math.random();if(reward>.58){money+=level*50+25;toast(`BAÚ: +${level*50+25} moedas`)}else{if(level<5){level++;xp=0;scene.remove(dino);dino=makeDino();dino.position.copy(new THREE.Vector3(0,0,0));scene.add(dino);toast('BAÚ: NOVO DINOSSAURO!')}else{money+=150;toast('BAÚ: +150 moedas')}}setTimeout(()=>{c.userData.open=false;c.children[1].rotation.x=-.12;c.position.set((Math.random()-.5)*26,.05,(Math.random()-.5)*26)},3500)}
  let last=performance.now();function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1100)}
  function update(){requestAnimationFrame(update);const now=performance.now(),dt=Math.min((now-last)/1000,.04);last=now;if(active){let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x;let dz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+stick.y;const l=Math.hypot(dx,dz);if(l>.05){dx/=Math.max(1,l);dz/=Math.max(1,l);dino.position.x+=dx*5.2*dt;dino.position.z+=dz*5.2*dt;dino.rotation.y=Math.atan2(dx,dz);dino.children.forEach(c=>{if(c.userData.leg)c.rotation.x=Math.sin(now*.012)*.35})}dino.position.x=THREE.MathUtils.clamp(dino.position.x,-22,22);dino.position.z=THREE.MathUtils.clamp(dino.position.z,-22,22);
    for(const p of people){if(!p.userData.alive)continue;const dx=dino.position.x-p.position.x,dz=dino.position.z-p.position.z,d=Math.hypot(dx,dz);if(d<7&&d>.8){p.position.x+=dx/d*dt*.8;p.position.z+=dz/d*dt*.8;p.rotation.y=Math.atan2(dx,dz)}}
    const need=100+(level-1)*75;if(xp>=need){xp-=need;level=Math.min(5,level+1);scene.remove(dino);dino=makeDino();dino.position.set(0,0,0);scene.add(dino);toast('EVOLUÇÃO!')}}
    camera.position.lerp(new THREE.Vector3(dino.position.x,dino.position.y+9,dino.position.z+13),.06);camera.lookAt(dino.position.x,dino.position.y+.7,dino.position.z);
    const need=100+(level-1)*75;document.querySelector('#xp').style.width=Math.min(100,xp/need*100)+'%';document.querySelector('#lv').textContent='LV '+level;document.querySelector('#money').textContent=money;document.querySelector('#dinoName').textContent=levels[level-1].name;document.querySelector('#levelName').textContent=level+' • '+levels[level-1].name;
    renderer.render(scene,camera)}update();
  document.querySelector('#play').addEventListener('pointerdown',()=>{document.querySelector('#start').style.display='none';active=true});
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
