<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Jurassic Frontier</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110c;font-family:Inter,Arial,sans-serif}canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #000}#topbar{position:absolute;left:18px;right:18px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}
    .panel{background:linear-gradient(135deg,rgba(7,18,12,.78),rgba(12,27,18,.48));border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px);border-radius:12px;padding:10px 14px}.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:2px}.brand small{display:block;font:700 8px Arial;letter-spacing:4px;color:#b9b89d;margin-top:2px}
    .status{display:flex;gap:10px}.meter{width:150px}.meter label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:5px}.bar{height:7px;background:rgba(0,0,0,.5);border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#7fb65a,#b3d27c);box-shadow:0 0 12px #91b86a}.stamina .fill{background:linear-gradient(90deg,#c1a45c,#e8d98b)}
    #quest{position:absolute;left:18px;bottom:24px;width:230px}.questtitle{font-size:9px;color:#c6b989;font-weight:800;letter-spacing:2px}.questname{font-family:Georgia,serif;font-size:16px;margin:4px 0}.questprogress{font-size:11px;color:#ddd}
    #crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;border:1px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%)}
    #prompt{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:1px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;display:none}
    #start{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12vh;background:radial-gradient(circle at 50% 35%,rgba(33,62,41,.1),rgba(3,8,5,.65));pointer-events:auto;color:white;text-align:center}.startcard{width:min(520px,calc(100% - 32px));background:linear-gradient(160deg,rgba(8,18,12,.92),rgba(22,38,27,.82));border:1px solid rgba(208,197,149,.28);border-radius:18px;padding:28px;box-shadow:0 20px 60px #000}.startcard h1{font-family:Georgia,serif;font-size:46px;margin:0;color:#f1ecd3;letter-spacing:3px}.startcard h1 span{display:block;font-family:Arial;font-size:10px;letter-spacing:8px;color:#aaa27f;margin:8px 0 18px}.startcard p{color:#c6cbbf;font-size:13px;line-height:1.7}.startcard button{pointer-events:auto;border:1px solid #d1c9a5;background:linear-gradient(180deg,#8e9a67,#596744);color:white;border-radius:7px;padding:14px 36px;font-size:11px;font-weight:900;letter-spacing:3px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.35)}
    #controls{position:fixed;z-index:10;left:18px;right:18px;bottom:18px;display:none;pointer-events:none}.stick{width:112px;height:112px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(0,0,0,.12);position:absolute;bottom:0;left:0;pointer-events:auto}.knob{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);position:absolute;left:32px;top:32px}.actions{position:absolute;right:0;bottom:4px;display:grid;grid-template-columns:repeat(2,58px);gap:8px}.act{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(20,35,25,.55);color:white;font-size:10px;font-weight:900;pointer-events:auto;touch-action:none}
    @media(max-width:700px),(pointer:coarse){#controls{display:block}.status{display:none}#quest{bottom:118px;width:190px}.brand{font-size:16px}.startcard h1{font-size:36px}.brand small{letter-spacing:2px}}
  </style>
</head>
<body>
  <div id="hud"><div id="topbar"><div class="panel brand">JURASSIC FRONTIER<small>THE LOST VALLEY</small></div><div class="status"><div class="panel meter"><label><span>VITALIDADE</span><span id="hptext">100</span></label><div class="bar"><div class="fill" id="hp"></div></div></div><div class="panel meter stamina"><label><span>VIGOR</span><span id="sttext">100</span></label><div class="bar"><div class="fill" id="stamina"></div></div></div></div></div><div id="crosshair"></div><div id="prompt">E  •  COLHER FRUTOS</div><div id="quest" class="panel"><div class="questtitle">MISSÃO ATIVA</div><div class="questname">O despertar da floresta</div><div class="questprogress"><span id="questcount">0</span>/5 frutos coletados</div></div></div>
  <div id="start"><div class="startcard"><h1>JURASSIC<span>FRONTIER</span></h1><p>Explore a floresta primordial, evite o rebanho e encontre frutos raros antes que a noite chegue.</p><button id="play">EXPLORAR</button></div></div>
  <div id="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="act" id="run">CORRER</button><button class="act" id="interact">AÇÃO</button></div></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x8da69a);scene.fog=new THREE.FogExp2(0x8da69a,.012);
    const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);camera.position.set(0,3,10);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.prepend(renderer.domElement);
    const hemi=new THREE.HemisphereLight(0xcbdac7,0x405236,1.55);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe7bb,2.6);sun.position.set(-70,90,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;sun.shadow.camera.far=300;scene.add(sun);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800,180,180),new THREE.MeshStandardMaterial({color:0x4f613d,roughness:1}));const gp=ground.geometry.attributes.position;for(let i=0;i<gp.count;i++){const x=gp.getX(i),y=gp.getY(i);gp.setZ(i,(Math.sin(x*.035)*1.8+Math.sin(y*.045)*1.4+Math.sin((x+y)*.018)*2)*.55)}ground.geometry.computeVertexNormals();ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    // realistic layered distant mountains
    for(let z=-180;z<180;z+=30){for(let side of [-1,1]){const m=new THREE.Mesh(new THREE.ConeGeometry(35+Math.random()*25,55+Math.random()*45,7),new THREE.MeshStandardMaterial({color:0x34473b,roughness:1,flatShading:true}));m.position.set(side*(180+Math.random()*30),20,z+Math.random()*20);m.rotation.y=Math.random();scene.add(m)}}
    const trunkMat=new THREE.MeshStandardMaterial({color:0x3b2d20,roughness:.95});const leafMat=new THREE.MeshStandardMaterial({color:0x315638,roughness:.85,side:THREE.DoubleSide});
    function tree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.42*s,.75*s,5*s,7),trunkMat);trunk.position.y=2.5*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<5;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((2.2-i*.22)*s,4.2*s,8),leafMat);crown.position.y=(4+i*1.1)*s;crown.rotation.y=i*.8;crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g)}
    for(let i=0;i<90;i++){let x=(Math.random()-.5)*290,z=(Math.random()-.5)*290;if(Math.abs(x)<16&&Math.abs(z)<16)continue;tree(x,z,.7+Math.random()*1.2)}
    // Ferns and rocks
    const fernMat=new THREE.MeshStandardMaterial({color:0x52784b,side:THREE.DoubleSide,roughness:.9});
    for(let i=0;i<220;i++){const g=new THREE.Group();for(let j=0;j<5;j++){const fr=new THREE.Mesh(new THREE.SphereGeometry(.12,5,3).scale(.12,1.3,2),fernMat);fr.position.set(Math.sin(j*1.25)*.3,0.35,Math.cos(j*1.25)*.3);fr.rotation.z=Math.sin(j)*.7;g.add(fr)}g.position.set((Math.random()-.5)*250,(Math.random()-.5)*0.5,(Math.random()-.5)*250);g.scale.setScalar(.5+Math.random()*1.1);scene.add(g)}
    // Avatar triceratops
    function dinosaur(){const g=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:0x776b45,roughness:.9});const belly=new THREE.MeshStandardMaterial({color:0x9b956c,roughness:.9});const body=new THREE.Mesh(new THREE.SphereGeometry(1.35,18,12),skin);body.scale.set(1.55,.8,1);body.position.y=1.5;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.72,16,10),skin);head.position.set(0,1.75,1.75);head.scale.set(.9,.75,1.25);head.castShadow=true;g.add(head);const frill=new THREE.Mesh(new THREE.CylinderGeometry(.9,.45,.18,12),new THREE.MeshStandardMaterial({color:0x94805a,roughness:.9,side:THREE.DoubleSide}));frill.rotation.x=Math.PI/2;frill.position.set(0,2.05,1.35);frill.scale.set(1,1,.9);g.add(frill);for(const x of [-.42,.42]){const horn=new THREE.Mesh(new THREE.ConeGeometry(.09,.75,7),new THREE.MeshStandardMaterial({color:0xcbbd91,roughness:.7}));horn.position.set(x,2.05,2.23);horn.rotation.x=.15;g.add(horn)}const bh=new THREE.Mesh(new THREE.ConeGeometry(.12,1,7),new THREE.MeshStandardMaterial({color:0xcbbd91}));bh.position.set(0,1.7,2.62);bh.rotation.x=Math.PI/2.8;g.add(bh);for(const x of [-.75,.75])for(const z of [-.65,.65]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.15,8),skin);leg.position.set(x,0.55,z+.15);leg.castShadow=true;g.add(leg)}g.scale.setScalar(.85);return g}const player=dinosaur();player.position.set(0,0,4);scene.add(player);
    // Wild dinosaurs
    const wild=[];for(let i=0;i<7;i++){const d=dinosaur();d.scale.setScalar(.55+Math.random()*.25);d.position.set((Math.random()-.5)*100,0,(Math.random()-.5)*100);d.rotation.y=Math.random()*6.28;scene.add(d);wild.push({mesh:d,dir:Math.random()*6.28,speed:.5+Math.random()*.7})}
    // fruit nodes
    const fruits=[];for(let i=0;i<12;i++){const g=new THREE.Group();for(let j=0;j<3;j++){const f=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),new THREE.MeshStandardMaterial({color:j==1?0xb84c34:0xa79a45,roughness:.6}));f.position.set((j-1)*.25,.65+(j%2)*.12,0);g.add(f)}g.position.set((Math.random()-.5)*100,0,(Math.random()-.5)*100);g.userData.collected=false;scene.add(g);fruits.push(g)}
    let yaw=0,pitch=-.12,keys={},stamina=100,collected=0,started=false,running=false;
    addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'||e.code==='Enter')interact();if(e.code==='ShiftLeft')running=true});addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft')running=false});
    let dragging=false,lastX=0,lastY=0;addEventListener('pointerdown',e=>{if(e.target.tagName==='CANVAS'){dragging=true;lastX=e.clientX;lastY=e.clientY}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){yaw-= (e.clientX-lastX)*.003;pitch=Math.max(-.5,Math.min(.25,pitch-(e.clientY-lastY)*.002));lastX=e.clientX;lastY=e.clientY}});
    document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none'};
    const stick=document.getElementById('stick'),knob=document.getElementById('knob');let joy={x:0,y:0},joyId=null;stick.addEventListener('pointerdown',e=>{joyId=e.pointerId;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});stick.addEventListener('pointerup',()=>{joyId=null;joy={x:0,y:0};knob.style.transform='translate(0,0)'});function joyMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.min(38,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*len/38,y:Math.sin(a)*len/38};knob.style.transform=`translate(${Math.cos(a)*len}px,${Math.sin(a)*len}px)`}document.getElementById('run').addEventListener('pointerdown',()=>running=true);document.getElementById('run').addEventListener('pointerup',()=>running=false);document.getElementById('interact').onclick=interact;
    function interact(){if(!started)return;let nearest=null,nd=99;for(const f of fruits)if(!f.userData.collected){const d=f.position.distanceTo(player.position);if(d<nd&&d<3){nearest=f;nd=d}}if(nearest){nearest.userData.collected=true;nearest.visible=false;collected++;document.getElementById('questcount').textContent=collected;if(collected>=5){document.querySelector('.questname').textContent='Missão concluída';document.querySelector('.questprogress').textContent='A floresta voltou a despertar'}}}
    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(started){let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,mz=(keys.KeyS?1:0)-(keys.KeyW?1:0)-joy.y;mx=Math.max(-1,Math.min(1,mx));mz=Math.max(-1,Math.min(1,mz));const moveLen=Math.hypot(mx,mz);if(moveLen>.08){const a=yaw+Math.atan2(mx,mz),speed=(running&&stamina>0?7:3.8);player.position.x+=Math.sin(a)*speed*dt*(moveLen>1?1:moveLen);player.position.z+=Math.cos(a)*speed*dt*(moveLen>1?1:moveLen);player.rotation.y=a;player.position.x=Math.max(-180,Math.min(180,player.position.x));player.position.z=Math.max(-180,Math.min(180,player.position.z));if(running&&stamina>0)stamina-=20*dt;else stamina=Math.min(100,stamina+10*dt)}else stamina=Math.min(100,stamina+12*dt);document.getElementById('stamina').style.width=stamina+'%';document.getElementById('sttext').textContent=Math.round(stamina);for(const w of wild){w.dir+=Math.sin(performance.now()*0.0002+z)=>0}(0);w.mesh.position.x+=Math.cos(w.dir)*w.speed*dt;w.mesh.position.z+=Math.sin(w.dir)*w.speed*dt;w.mesh.rotation.y=-w.dir+Math.PI/2;if(Math.abs(w.mesh.position.x)>150)w.dir+=Math.PI;if(Math.abs(w.mesh.position.z)>150)w.dir+=Math.PI}}
    // camera is implemented separately each frame
    function frame(){const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const target=player.position.clone().add(new THREE.Vector3(0,2.2,0));const desired=target.clone().add(dir.multiplyScalar(-9)).add(new THREE.Vector3(0,4.5,0));camera.position.lerp(desired,.12);camera.lookAt(target.x,target.y+pitch*3,target.z)}frame();renderer.setAnimationLoop(()=>{animateInternal()})
    function animateInternal(){requestAnimationFrame(()=>{});frame();renderer.render(scene,camera)}
    // Replace the custom loop with a clean loop
    const original=animate;let promptSeen=false;
    function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);renderer.render(scene,camera);if(started){let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,mz=(keys.KeyS?1:0)-(keys.KeyW?1:0)-joy.y;mx=Math.max(-1,Math.min(1,mx));mz=Math.max(-1,Math.min(1,mz));let len=Math.hypot(mx,mz);if(len>.08){let a=yaw+Math.atan2(mx,mz),speed=(running&&stamina>0?7:3.8);player.position.x+=Math.sin(a)*speed*dt*(len>1?1:len);player.position.z+=Math.cos(a)*speed*dt*(len>1?1:len);player.rotation.y=a;player.position.x=Math.max(-180,Math.min(180,player.position.x));player.position.z=Math.max(-180,Math.min(180,player.position.z));if(running&&stamina>0)stamina-=20*dt;else stamina=Math.min(100,stamina+10*dt)}else stamina=Math.min(100,stamina+12*dt);document.getElementById('stamina').style.width=stamina+'%';document.getElementById('sttext').textContent=Math.round(stamina);for(const w of wild){w.dir+=Math.sin(performance.now()*0.0007+w.mesh.id)*.002;w.mesh.position.x+=Math.cos(w.dir)*w.speed*dt;w.mesh.position.z+=Math.sin(w.dir)*w.speed*dt;w.mesh.rotation.y=-w.dir+Math.PI/2;if(Math.abs(w.mesh.position.x)>150)w.dir+=Math.PI;if(Math.abs(w.mesh.position.z)>150)w.dir+=Math.PI}let found=false;for(const f of fruits)if(!f.userData.collected&&f.position.distanceTo(player.position)<3.2)found=true;document.getElementById('prompt').style.display=found?'block':'none'}frame()}renderer.setAnimationLoop(null);loop();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
</html>
